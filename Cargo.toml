[workspace]
members = ["crates/bl4-core", "crates/bl4-desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
bl4-core = { path = "crates/bl4-core" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
slint-build = "=1.18.1"

[profile.release]
lto = "thin"
codegen-units = 1
